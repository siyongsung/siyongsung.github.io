        highlights:
          - Scheduled inspections, troubleshooting, and corrective maintenance on F-16 and KF-16 avionics systems using technical orders, schematics, and test equipment.
          - Documented maintenance actions, discrepancies, and parts requests to squadron procedures.
          - Supported a Lockheed Martin field engineer with Korean–English technical interpretation during an investigation of an F-16 communication system.

