cv:
  name: Siyong Sung
  label: M.S. Student, Mechanical and Aerospace Engineering
  email: syong.sung1@gmail.com
  location: New Brunswick, NJ
  image: ""
  summary: Controls-focused M.S. student developing wind-preview nonlinear MPC for gust rejection on multirotor UAVs, with the controller taken from simulation through PX4 software-in-the-loop to 47 indoor flights. Hands-on avionics background on F-16 aircraft (schematics, wiring, test equipment, technical documentation) and FAA A&P certified. Interested in flight control, GNC, and taking control algorithms from simulation to real hardware.

  social_networks:
    - network: GitHub
      username: siyongsung
    - network: LinkedIn
      username: siyong-sung-693a242b0

  sections:
    Education:
      - institution: Rutgers University
        location: New Brunswick, NJ
        url: https://mae.rutgers.edu/
        area: Mechanical and Aerospace Engineering
        studyType: Master of Science
        start_date: 2025-01
        end_date: 2027-01 (expected)
        score: "GPA 3.833 / 4.0"
        highlights:
          - "Thesis: Wind Preview-Based Nonlinear Model Predictive Control for Gust Disturbance Rejection in Quadrotor UAVs (advisor: Prof. Laurent Burlion)."
          - Implemented the controller in Python / acados on ROS 2 and PX4, and validated it in MATLAB, PX4 software-in-the-loop, and 47 indoor flights against a fan wall under motion capture.

      - institution: Southern Illinois University
        location: Carbondale, IL
        area: Aviation Technologies (Avionics)
        studyType: Bachelor of Science
        start_date: 2020-08
        end_date: 2024-12
        score: "GPA 3.938 / 4.0"
        highlights:
          - Overhauled and functionally tested the complete avionics suite of a Cessna cockpit on a test bench (senior project).
          - Designed and built an aircraft landing-gear warning system on Arduino.

      - institution: Orange Coast College
