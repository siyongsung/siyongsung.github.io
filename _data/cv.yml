        highlights:
          - "FAA A&P curriculum: airframe and powerplant maintenance, inspection, troubleshooting, and regulations; six-cylinder engine overhaul to the manufacturer's manual."
          - Avionics Certificate of Achievement (wiring practices, basic avionics troubleshooting).

